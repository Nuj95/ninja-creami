<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧊 Ninja Creami Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-light: #fafaf8;
      --bg-white: #ffffff;
      --text-dark: #1a1a18;
      --text-gray: #5f5e5a;
      --border: #d3d1c7;
      --accent: #185fa5;
      --success: #3b6d11;
      --danger: #a33;
      --frigo-bg: #f0ebe5;
      --frigo-text: #4a4a48;
      --frigo-active-bg: #3a3a38;
      --frigo-active-text: #fff;
    }

    body.dark-mode {
      --bg-light: #1a1a18;
      --bg-white: #2a2a28;
      --text-dark: #fafaf8;
      --text-gray: #a8a7a3;
      --border: #3a3a38;
      --frigo-bg: #3a3a38;
      --frigo-text: #d0cfcb;
      --frigo-active-bg: #fafaf8;
      --frigo-active-text: #1a1a18;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-light);
      color: var(--text-dark);
      padding: 0;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      background: var(--bg-white);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .dark-toggle {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0;
    }

    /* FRIGO PANEL */
    .frigo-panel {
      background: var(--bg-white);
      border-bottom: 1px solid var(--border);
      padding: 16px;
      margin-bottom: 12px;
    }

    .frigo-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-gray);
      margin-bottom: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .frigo-toggle-btn {
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      color: var(--text-gray);
    }

    .frigo-content {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
      max-height: 300px;
      overflow-y: auto;
    }

    .frigo-content.collapsed {
      display: none;
    }

    .frigo-item {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--frigo-bg);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: var(--frigo-text);
      transition: all 0.15s;
      user-select: none;
      text-align: center;
    }

    .frigo-item.active {
      background: var(--frigo-active-bg);
      color: var(--frigo-active-text);
      border-color: var(--frigo-active-bg);
    }

    .frigo-reset {
      margin-top: 12px;
      font-size: 11px;
      color: var(--accent);
      cursor: pointer;
      font-weight: 500;
      text-decoration: underline;
    }

    /* FILTERS */
    .filters {
      background: var(--bg-white);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      position: sticky;
      top: 52px;
      z-index: 99;
    }

    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg-light);
      color: var(--text-gray);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn.active {
      background: var(--text-dark);
      color: var(--bg-light);
      border-color: var(--text-dark);
    }

    /* STATS */
    .stats {
      background: var(--bg-white);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      font-size: 12px;
      color: var(--text-gray);
    }

    .stats strong {
      color: var(--text-dark);
    }

    /* RECIPES GRID */
    .recipes-grid {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }

    .recipe-card {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.2s;
      position: relative;
    }

    .recipe-card.unavailable {
      opacity: 0.4;
      pointer-events: none;
    }

    .recipe-card.hidden {
      display: none;
    }

    .recipe-card.swiping {
      transform: translateX(-60px);
    }

    .recipe-header {
      padding: 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .recipe-header:hover {
      background: var(--bg-light);
    }

    .recipe-info {
      flex: 1;
    }

    .recipe-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-dark);
    }

    .recipe-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .badge {
      font-size: 10px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 12px;
      background: #eaf3de;
      color: #3b6d11;
    }

    .badge.whey {
      background: #e6f1fb;
      color: var(--accent);
    }

    .badge.casein {
      background: #ffe6f0;
      color: #a33;
    }

    .recipe-toggle {
      font-size: 20px;
      color: var(--text-gray);
      min-width: 20px;
      text-align: center;
      margin-top: 2px;
    }

    /* RECIPE BODY */
    .recipe-body {
      display: none;
      border-top: 1px solid var(--border);
      padding: 14px;
      background: var(--bg-light);
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-gray);
    }

    .recipe-body.open {
      display: block;
    }

    .recipe-body h3 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 12px 0 8px;
      color: var(--text-dark);
    }

    .recipe-body h3:first-child {
      margin-top: 0;
    }

    .ingredients-table {
      width: 100%;
      margin-bottom: 12px;
      border-collapse: collapse;
    }

    .ingredients-table tr {
      border-bottom: 1px solid var(--border);
    }

    .ingredients-table tr:last-child {
      border-bottom: none;
    }

    .ingredients-table td {
      padding: 6px 0;
      font-size: 12px;
    }

    .ingredients-table td:last-child {
      text-align: right;
      font-weight: 600;
      color: var(--text-dark);
    }

    .protocol {
      list-style: none;
      margin-bottom: 12px;
    }

    .protocol li {
      margin-bottom: 10px;
      padding-left: 20px;
      position: relative;
      line-height: 1.5;
    }

    .protocol li:before {
      content: attr(data-step);
      position: absolute;
      left: 0;
      font-weight: 600;
      color: var(--accent);
    }

    .mode-info {
      background: var(--bg-white);
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 500;
      margin-bottom: 12px;
      color: var(--text-dark);
    }

    .macros {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin: 12px 0;
    }

    .macro {
      background: var(--bg-white);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      text-align: center;
      color: var(--text-gray);
    }

    .macro-value {
      font-weight: 600;
      color: var(--text-dark);
      display: block;
    }

    .source {
      font-size: 10px;
      color: var(--text-gray);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .source a {
      color: var(--accent);
      text-decoration: none;
    }

    /* BUTTONS */
    .recipe-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-white);
      color: var(--text-dark);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn:hover {
      background: var(--text-dark);
      color: var(--bg-light);
      border-color: var(--text-dark);
    }

    .btn-prepare {
      grid-column: 1 / -1;
      background: var(--success);
      color: white;
      border-color: var(--success);
    }

    .btn-prepare:hover {
      opacity: 0.8;
    }

    .btn-archive {
      grid-column: 1 / -1;
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }

    .btn-archive:hover {
      opacity: 0.8;
    }

    .btn-consumed {
      grid-column: 1 / -1;
      background: var(--success);
      color: white;
      border-color: var(--success);
    }

    /* ARCHIVE SWIPE */
    .archive-button {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      width: 60px;
      background: var(--danger);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      z-index: -1;
    }

    /* RATING STARS */
    .rating-input {
      display: flex;
      gap: 4px;
      margin: 8px 0;
    }

    .star {
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.1s;
      user-select: none;
    }

    .star:hover {
      transform: scale(1.15);
    }

    .star.empty {
      opacity: 0.3;
    }

    .star.filled {
      color: #ffc107;
      opacity: 1;
    }

    .notes-textarea {
      width: 100%;
      margin-top: 8px;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg-white);
      color: var(--text-dark);
      font-family: inherit;
      font-size: 11px;
      resize: vertical;
      min-height: 50px;
    }

    /* PREPARED ITEMS */
    .prepared-item {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .prepared-info {
      flex: 1;
    }

    .prepared-title {
      font-weight: 600;
      margin-bottom: 2px;
      cursor: pointer;
      color: var(--accent);
    }

    .prepared-date {
      font-size: 11px;
      color: var(--text-gray);
    }

    .prepared-actions {
      display: flex;
      gap: 6px;
    }

    .btn-small {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--success);
      color: white;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-small:hover {
      opacity: 0.8;
    }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-gray);
      font-size: 14px;
    }

    /* MOBILE RESPONSIVENESS */
    @media (max-width: 640px) {
      .recipes-grid {
        grid-template-columns: 1fr;
      }

      .filters {
        overflow-x: auto;
        flex-wrap: nowrap;
      }

      .frigo-content {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      }
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-light);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-gray);
    }

  </style>
</head>

<header>

  <button class="dark-toggle" id="darkToggle" title="Dark mode">🌙</button>

    </div>
    <div class="frigo-reset" onclick="resetFrigo()">Tout décocher</div>
  </div>

  <!-- FILTERS -->

    <button class="filter-btn active" data-filter="all" onclick="setFilter(this)">Toutes</button>
    <button class="filter-btn" data-filter="glace" onclick="setFilter(this)">Glace</button>
    <button class="filter-btn" data-filter="froyo" onclick="setFilter(this)">Frozen Yogurt</button>

    <button class="filter-btn" data-filter="archived" onclick="setFilter(this)">📦 Archivées</button>
  </div>

  <!-- STATS -->
  <div class="stats">
    <span id="statsText"></span>
  </div>

  <!-- RECIPES GRID -->
  <div class="recipes-grid" id="recipesGrid">
    <!-- Dynamique JS -->
  </div>

  <div class="empty-state" id="emptyState" style="display: none;">
    Aucune recette disponible.
  </div>

</div>

// ==== INGREDIENTS MAPPING ====
const ingredientsMap = {
  fromage_blanc: "Fromage blanc 0%",
  yaourt_grec: "Yaourt grec 0%",
  lait: "Lait",
  caseine_choco: "Caséine chocolat",
  whey_cookie: "Whey biscuit cookie",
  whey_cc: "Whey cookies & cream",
  fruits_rouges: "Fruits rouges",
  mangue: "Mangue congelée",
  fraises: "Fraises congelées",
  miel: "Miel",
  vanilla_drops: "Vanilla drops",
  guar_gum: "Guar gum",
  puree_noisette: "Purée noisette",
  oreo: "Oréos",
  spread_pistachio: "Spread pistachio",
  spread_choco_noisette: "Spread choco noisette",
  spread_milky_nut: "Spread milky nut"
};

// ==== STATE ====
let selectedIngredients = new Set(Object.keys(ingredientsMap));
let currentFilter = "all";
let recipes = JSON.parse(JSON.stringify(recipesData));

// ==== INIT ====
function init() {
  loadFromStorage();
  renderFrigo();
  updateRecipes();
  updateStats();
  document.getElementById("darkToggle").addEventListener("click", toggleDarkMode);
}

// ==== STORAGE ====
function loadFromStorage() {
  const stored = localStorage.getItem("ninjaCreami");
  if (stored) {
    const data = JSON.parse(stored);
    selectedIngredients = new Set(data.selectedIngredients || Object.keys(ingredientsMap));
    recipes = data.recipes || JSON.parse(JSON.stringify(recipesData));
    if (localStorage.getItem("darkMode") === "true") {
      document.body.classList.add("dark-mode");
    }
  }
}

function saveToStorage() {
  localStorage.setItem("ninjaCreami", JSON.stringify({
    selectedIngredients: Array.from(selectedIngredients),
    recipes: recipes
  }));
}

// ==== FRIGO ====
function renderFrigo() {
  const container = document.getElementById("frigoContent");
  container.innerHTML = "";
  Object.entries(ingredientsMap).forEach(([key, label]) => {
    const div = document.createElement("div");
    div.className = "frigo-item" + (selectedIngredients.has(key) ? " active" : "");
    div.textContent = label;
    div.onclick = () => toggleIngredient(key);
    container.appendChild(div);
  });
}

function toggleIngredient(key) {
  if (selectedIngredients.has(key)) {
    selectedIngredients.delete(key);
  } else {
    selectedIngredients.add(key);
  }
  renderFrigo();
  updateRecipes();
  saveToStorage();
}

function resetFrigo() {
  selectedIngredients.clear();
  renderFrigo();
  updateRecipes();
  saveToStorage();
}

function toggleFrigoCollapse() {
  const content = document.getElementById("frigoContent");
  const btn = document.getElementById("frigoToggleBtn");
  content.classList.toggle("collapsed");
  btn.textContent = content.classList.contains("collapsed") ? "▶" : "▼";
}

// ==== FILTERS ====
function setFilter(btn) {
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentFilter = btn.dataset.filter;
  updateRecipes();
}

// ==== RECIPES ====
function updateRecipes() {
  const grid = document.getElementById("recipesGrid");
  grid.innerHTML = "";
  
  let visible = 0;
  
  // Cas spécial : filtre "prepared"
  if (currentFilter === "prepared") {
    const preparedRecipes = recipes.filter(r => r.prepared && r.prepared.length > 0);
    if (preparedRecipes.length === 0) {
      document.getElementById("emptyState").style.display = "block";
      updateStats();
      return;
    }
    preparedRecipes.forEach(recipe => {
      recipe.prepared.forEach((prep, index) => {
        const card = createPreparedCard(recipe, prep, index);
        grid.appendChild(card);
        visible++;
      });
    });
  } else {
    recipes.forEach(recipe => {
      const hasAll = recipe.requiredIngredients.every(i => selectedIngredients.has(i));
      const typeMatch = currentFilter === "all" || recipe.type === currentFilter ||
                        (currentFilter === "archived" && recipe.status === "archived");
      
      if (!typeMatch || recipe.status === "archived") return;
      
      const card = createRecipeCard(recipe, hasAll);
      grid.appendChild(card);
      visible++;
    });

    // Filtre archived
    if (currentFilter === "archived") {
      const archived = recipes.filter(r => r.status === "archived");
      archived.forEach(recipe => {
        const card = createRecipeCard(recipe, true);
        grid.appendChild(card);
        visible++;
      });
    }
  }

  document.getElementById("emptyState").style.display = visible === 0 ? "block" : "none";
  updateStats();
}

function createRecipeCard(recipe, available) {
  const card = document.createElement("div");
  card.className = "recipe-card" + (available ? "" : " unavailable");
  card.dataset.recipeId = recipe.id;

  const header = document.createElement("div");
  header.className = "recipe-header";
  header.onclick = () => toggleCardBody(card);

  const info = document.createElement("div");
  info.className = "recipe-info";

  const title = document.createElement("div");
  title.className = "recipe-title";
  title.textContent = recipe.title;
  info.appendChild(title);

  const meta = document.createElement("div");
  meta.className = "recipe-meta";

  const proteinBadge = document.createElement("span");
  proteinBadge.className = "badge";
  proteinBadge.textContent = `💪 ${recipe.proteinGrams}g`;
  meta.appendChild(proteinBadge);

  const typeBadge = document.createElement("span");
  typeBadge.className = "badge whey";
  typeBadge.textContent = recipe.proteinType;
  meta.appendChild(typeBadge);

  info.appendChild(meta);

  const toggle = document.createElement("div");
  toggle.className = "recipe-toggle";
  toggle.textContent = "+";

  header.appendChild(info);
  header.appendChild(toggle);
  card.appendChild(header);

  const body = createRecipeBody(recipe);
  card.appendChild(body);

  // Swipe archive
  let startX = 0;
  card.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
  });

  card.addEventListener("touchmove", (e) => {
    const currentX = e.touches[0].clientX;
    const diff = startX - currentX;
    if (diff > 50) {
      card.classList.add("swiping");
    }
  });

  card.addEventListener("touchend", () => {
    card.classList.remove("swiping");
  });

  return card;
}

function createPreparedCard(recipe, prep, index) {
  const card = document.createElement("div");
  card.className = "prepared-item";

  const info = document.createElement("div");
  info.className = "prepared-info";

  const title = document.createElement("div");
  title.className = "prepared-title";
  title.textContent = recipe.title;
  title.onclick = () => {
    const body = document.querySelector(`[data-recipe-id="${recipe.id}"]`)?.querySelector(".recipe-body");
    if (body) body.classList.toggle("open");
  };
  info.appendChild(title);

  const date = document.createElement("div");
  date.className = "prepared-date";
  date.textContent = `📅 ${prep.date} ${prep.eaten ? "✅ Mangé" : "🧊 En congélation"}`;
  info.appendChild(date);

  const actions = document.createElement("div");
  actions.className = "prepared-actions";

  const consumedBtn = document.createElement("button");
  consumedBtn.className = "btn-small";
  consumedBtn.textContent = "✅ Consommé";
  consumedBtn.onclick = () => markConsumed(recipe.id, index);
  actions.appendChild(consumedBtn);

  card.appendChild(info);
  card.appendChild(actions);

  return card;
}

function createRecipeBody(recipe) {
  const body = document.createElement("div");
  body.className = "recipe-body";
  body.dataset.recipeId = recipe.id;

  let html = `
    <h3>Mode Ninja</h3>
    <div class="mode-info">
      ${recipe.mode}
      ${recipe.respin ? " + Re-Spin" : ""}
    </div>

    <h3>Base</h3>
    <table class="ingredients-table">
  `;

  recipe.ingredients.base.forEach(ing => {
    html += `<tr><td>${ing.name}</td><td>${ing.amount} ${ing.unit}</td></tr>`;
  });

  html += `</table>`;

  if (recipe.ingredients.mixins) {
    html += `<h3>Mix-In</h3><table class="ingredients-table">`;
    recipe.ingredients.mixins.forEach(ing => {
      html += `<tr><td>${ing.name}</td><td>${ing.amount} ${ing.unit}</td></tr>`;
    });
    html += `</table>`;
  }

  html += `<h3>Protocole</h3><ol class="protocol">`;
  recipe.protocol.forEach((step, i) => {
    html += `<li data-step="${i + 1}.">${step}</li>`;
  });
  html += `</ol>`;

  html += `<h3>Macros</h3><div class="macros">
    <div class="macro"><span class="macro-value">${recipe.macros.proteins}g</span> Protéines</div>
    <div class="macro"><span class="macro-value">${recipe.macros.fats}g</span> Lipides</div>
    <div class="macro"><span class="macro-value">${recipe.macros.carbs}g</span> Glucides</div>
    <div class="macro"><span class="macro-value">${recipe.macros.calories}</span> kcal</div>
  </div>`;

  html += `<h3>Rating</h3>
    <div class="rating-input" id="rating-${recipe.id}">`;
  for (let i = 1; i <= 5; i++) {
    const filled = i <= recipe.rating ? " filled" : " empty";
    html += `<span class="star${filled}" onclick="rateRecipe('${recipe.id}', ${i})">⭐</span>`;
  }
  html += `</div>
    <textarea class="notes-textarea" placeholder="Notes (optionnel)" onchange="updateNotes('${recipe.id}', this.value)">${recipe.notes || ""}</textarea>
    
    <div class="recipe-actions">
      <button class="btn btn-prepare" onclick="markPrepared('${recipe.id}')">📅 Préparer</button>
      <button class="btn btn-archive" onclick="archiveRecipe('${recipe.id}')">📦 Archiver</button>
    </div>

    <div class="source">Source: <a href="#" target="_blank">${recipe.source}</a></div>`;

  body.innerHTML = html;
  return body;
}

function toggleCardBody(card) {
  card.querySelector(".recipe-body").classList.toggle("open");
  const toggle = card.querySelector(".recipe-toggle");
  toggle.textContent = toggle.textContent === "+" ? "−" : "+";
}

// ==== RATING & NOTES ====
function rateRecipe(recipeId, rating) {
  const recipe = recipes.find(r => r.id === recipeId);
  recipe.rating = rating;
  saveToStorage();
  updateRecipes();
}

function updateNotes(recipeId, notes) {
  const recipe = recipes.find(r => r.id === recipeId);
  recipe.notes = notes;
  saveToStorage();
}

// ==== MEAL PREP ====
function markPrepared(recipeId) {
  const recipe = recipes.find(r => r.id === recipeId);
  if (!recipe.prepared) recipe.prepared = [];
  recipe.prepared.push({
    date: new Date().toISOString().split("T")[0],
    eaten: false
  });
  saveToStorage();
  updateRecipes();
  alert("✅ Marqué comme préparé le " + new Date().toLocaleDateString("fr-FR"));
}

function markConsumed(recipeId, index) {
  const recipe = recipes.find(r => r.id === recipeId);
  if (recipe.prepared && recipe.prepared[index]) {
    recipe.prepared[index].eaten = true;
    recipe.prepared.splice(index, 1);
    saveToStorage();
    updateRecipes();
    alert("✅ Supprimé de la liste de préparation");
  }
}

// ==== ARCHIVE ====
function archiveRecipe(recipeId) {
  const recipe = recipes.find(r => r.id === recipeId);
  recipe.status = "archived";
  saveToStorage();
  updateRecipes();
}

// ==== STATS ====
function updateStats() {
  const prepared = recipes.reduce((sum, r) => sum + (r.prepared ? r.prepared.length : 0), 0);
  const available = recipes.filter(r => r.requiredIngredients.every(i => selectedIngredients.has(i)) && r.status !== "archived").length;
  document.getElementById("statsText").innerHTML = `<strong>${available}</strong> recette${available > 1 ? "s" : ""} disponible${available > 1 ? "s" : ""} · <strong>${prepared}</strong> en préparation`;
}

// ==== DARK MODE ====
function toggleDarkMode() {
  document.body.classList.toggle("dark-mode");
  localStorage.setItem("darkMode", document.body.classList.contains("dark-mode"));
}

// ==== LAUNCH ====
init();
